name: Telegram Trigger

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: "GitHub issue number to process"
        required: true
        default: "1"
        type: string

jobs:
  process-issue:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get GitHub issue
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
        run: |
          gh issue view "$ISSUE_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --json number,title,body,state \
            > issue.json

          echo "Issue retrieved:"
          cat issue.json

      - name: Ask Trinity Large Preview
        env:
          ARCEE_API_KEY: ${{ secrets.ARCEE_API_KEY }}
        run: |
          ISSUE_JSON=$(cat issue.json)

          jq -n \
            --arg issue "$ISSUE_JSON" \
            '{
              model: "trinity-large-preview",
              messages: [
                {
                  role: "system",
                  content: "You are a senior software engineer. Analyze GitHub issues carefully. Do not write code yet. Produce a concise implementation plan with files to create or modify, design decisions, testing strategy, and potential risks."
                },
                {
                  role: "user",
                  content: ("Analyze this GitHub issue:\n\n" + $issue)
                }
              ],
              stream: false
            }' > request.json

          curl -sS \
            -X POST \
            "https://api.arcee.ai/api/v1/chat/completions" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${ARCEE_API_KEY}" \
            --data @request.json \
            > trinity_response.json

          echo "===== TRINITY RESPONSE ====="

          jq -r '.choices[0].message.content' trinity_response.json

      - name: Send Telegram message
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -sS \
            -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=🤖 Trinity analyzed GitHub Issue #${{ inputs.issue_number }}"